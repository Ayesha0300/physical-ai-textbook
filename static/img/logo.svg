<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Humanoid silhouette -->
  <circle cx="50" cy="30" r="10" stroke="#0ea5e9" stroke-width="2" fill="none"/>
  <line x1="50" y1="40" x2="50" y2="70" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="40" y1="55" x2="60" y2="55" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="40" y1="70" x2="45" y2="85" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="60" y1="70" x2="55" y2="85" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Neural network motif -->
  <circle cx="30" cy="20" r="3" fill="#06b6d4"/>
  <circle cx="70" cy="20" r="3" fill="#06b6d4"/>
  <circle cx="25" cy="40" r="3" fill="#06b6d4"/>
  <circle cx="75" cy="40" r="3" fill="#06b6d4"/>
  <circle cx="50" cy="50" r="3" fill="#06b6d4"/>

  <!-- Connecting lines -->
  <line x1="30" y1="20" x2="25" y2="40" stroke="#06b6d4" stroke-width="1"/>
  <line x1="30" y1="20" x2="50" y2="50" stroke="#06b6d4" stroke-width="1"/>
  <line x1="70" y1="20" x2="75" y2="40" stroke="#06b6d4" stroke-width="1"/>
  <line x1="70" y1="20" x2="50" y2="50" stroke="#06b6d4" stroke-width="1"/>
  <line x1="25" y1="40" x2="50" y2="50" stroke="#06b6d4" stroke-width="1"/>
  <line x1="75" y1="40" x2="50" y2="50" stroke="#06b6d4" stroke-width="1"/>
</svg>