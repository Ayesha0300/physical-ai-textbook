openapi: 3.0.0
info:
  title: Navigation API
  version: 1.0.0
  description: API for navigation data in the Physical AI Book platform

paths:
  /api/navigation:
    get:
      summary: Get navigation items
      responses:
        '200':
          description: Navigation items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          example: "Modules"
                        route:
                          type: string
                          example: "/modules"
                        position:
                          type: string
                          example: "left"
                        isActive:
                          type: boolean
                          example: false
                      required:
                        - label
                        - route
                        - position
                        - isActive